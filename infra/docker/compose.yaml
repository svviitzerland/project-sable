# Production stack on the EC2 instance in /opt/<project> (the Compose project takes that name).
# Settings come from .env, written by deploy.sh from instance.env and SSM. Images come from ECR.
# PostgreSQL is Amazon RDS (DB_HOST), reached over verified TLS with the RDS CA bundle.
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      JUDE_DOMAIN: ${JUDE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${JUDE_REGISTRY}/${JUDE_PROJECT}-web:${JUDE_TAG:-latest}
    restart: unless-stopped
    environment:
      JUDE_ENV: production
      JUDE_DEMO: ${JUDE_DEMO}
      JUDE_APP_URL: https://${JUDE_DOMAIN}
      ORIGIN: https://${JUDE_DOMAIN}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@${DB_HOST}:5432/app?sslmode=verify-full&sslrootcert=/certs/rds-ca.pem
      AI_PROVIDER: bedrock
      AWS_REGION: ${AWS_REGION}
      BEDROCK_MODEL: ${BEDROCK_MODEL}
      BEDROCK_REVIEW_MODEL: ${BEDROCK_REVIEW_MODEL}
      S3_BUCKET: ${S3_BUCKET}
      VOICE_API_URL: http://voice:8000
      VOICE_API_TOKEN: ${VOICE_TOKEN}
      PASAL_API_KEY: ${PASAL_API_KEY:-}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ${JUDE_REGISTRY}/${JUDE_PROJECT}-migrate:${JUDE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@${DB_HOST}:5432/app?sslmode=verify-full&sslrootcert=/certs/rds-ca.pem
    volumes:
      - ./certs:/certs:ro
    restart: "no"

  voice:
    image: ${JUDE_REGISTRY}/${JUDE_PROJECT}-voice:${JUDE_VOICE_TAG:-latest}
    restart: unless-stopped
    environment:
      VOICE_API_TOKEN: ${VOICE_TOKEN}
      VOICE_ENGINE: pyannote
    volumes:
      - voice-models:/models

volumes:
  caddy-data:
  caddy-config:
  voice-models:
