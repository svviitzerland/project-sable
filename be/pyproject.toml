[project]
name = "project-backend"
version = "0.1.0"
description = "FastAPI backend for this project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "websockets>=14,<16",
  "qstash>=3,<4",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

