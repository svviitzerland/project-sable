[project]
name = "jude-voice"
version = "0.1.0"
description = "Voice API for Jude: speaker voiceprints, identification and offline diarization."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "numpy>=2.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Open-source pyannote models (CPU wheels in Docker). Installed with `uv sync --extra ml`.
ml = [
  "pyannote.audio>=4.0",
  "torch>=2.8",
  "torchaudio>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jude_voice"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
